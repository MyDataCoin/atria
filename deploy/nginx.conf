# nginx-конфиг для фронтенда Atria (atria.kg).
# Кладётся на сервер в /etc/nginx/sites-available/atria и линкуется в sites-enabled.
#
# ВАЖНО: сайт работает по HTTPS, поэтому location /api/ ОБЯЗАН находиться внутри
# server-блока с `listen 443 ssl` — именно он обслуживает живой трафик. Если положить
# прокси только в блок `listen 80`, то POST /api/... по HTTPS попадёт в обработчик
# статики и вернёт 405 Not Allowed (что мы и видим).
#
# Пути сертификатов — стандартные для certbot/Let's Encrypt. Если certbot уже
# управляет конфигом этого домена, не дублируй server-блоки: просто добавь блок
# `location /api/ { ... }` в существующий server { listen 443 ssl; ... }.

# 80 → 443 (весь http-трафик на https)
server {
    listen 80;
    server_name atria.kg www.atria.kg;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name atria.kg www.atria.kg;

    ssl_certificate     /etc/letsencrypt/live/atria.kg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/atria.kg/privkey.pem;

    root /var/www/atria;
    index index.html;

    # --- Заголовки безопасности ---
    # Этот origin держит сессию (access-токен в localStorage) и делит refresh-куку со всей зоной
    # atria.kg, поэтому первый заход по http нельзя оставлять открытым: редиректа 80 → 443 мало,
    # его перехватывают до редиректа. `always` — чтобы заголовок ставился и на 4xx/5xx.
    #
    # includeSubDomains намеренно НЕ включён: HSTS кешируется браузером на год, и если хоть один
    # хост *.atria.kg обслуживается по http, он станет недоступен. Включить после проверки, что
    # все поддомены (api, app, admin и служебные) отвечают по https:
    #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Прокси API на бэкенд. Браузер ходит на свой же домен → CORS не нужен.
    # proxy_pass без пути сохраняет префикс /api (бэкенд ждёт /api/v1/...).
    location /api/ {
        proxy_pass https://api.atria.kg;
        proxy_http_version 1.1;
        proxy_set_header Host api.atria.kg;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
    }

    # Долгий кэш для хешированных ассетов Vite.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # add_header в location ОТМЕНЯЕТ серверные — повторяем их здесь, иначе ассеты остались бы
        # без заголовков безопасности.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # SPA: всё остальное отдаёт index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}